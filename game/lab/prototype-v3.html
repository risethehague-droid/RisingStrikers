<title>HC2 Test Lab v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* t-001 PROTOTYPE v3 of the revamped Test Lab (stage 1) = v2 + the Training ground; v1 and v2 stay as they were.
   v2: the same data and every v1 screen (under "Advanced"), with three beginner screens in front.
   v1 notes: Not the real Lab: it runs on a snapshot of real data
   (proto-data.js: a headless run of today's Lab on v0.9.7, new-dice reruns, a v0.9.4 baseline, the sprite atlases).
   Layout: an app shell - top bar, a section rail on the left (a tab strip on a phone), one working area per section.
   Dark first (it sits next to the floodlit pitch, like today's Lab), with a light theme for daylight and contrast. */
:root{
  --bg:#0f0d13; --panel:#17141d; --raise:#211d29; --line:#332d3f; --fg:#f4f0e4; --dim:#b8b0c4; --faint:#8a8298;
  --accent:#ffde1e; --on-accent:#0c0a0e; --brand:#ff2878; --data:#5ad3ec; --focus:#ffde1e;
  --pass:#7cff9a; --fail:#ff6b8e; --warn:#ffbe55; --changed:#c7a6ff; --same:#9fb4c8;
  --pitch:#07060a; --shadow:0 1px 0 rgba(0,0,0,.4);
  --over:rgba(12,10,14,.84); --over-fg:#f4f0e4; --over-hi:#ffde1e; --over-card:#f4f0e4; --over-ink:#0c0a0e;   /* on the game picture: the same in both themes */
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-pixel:"Press Start 2P",ui-monospace,monospace;
  --s-1:12px; --s0:14px; --s1:16px; --s2:19px; --s3:24px; --s4:30px;
  --rail:212px; --top:56px; --r:6px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f2f0f5; --panel:#ffffff; --raise:#ebe8f0; --line:#d3cedc; --fg:#17141c; --dim:#4f4860; --faint:#625b72;
  --accent:#ffde1e; --on-accent:#0c0a0e; --brand:#d0105a; --data:#00708a; --focus:#5a2fd0;
  --pass:#0b7a33; --fail:#c0123f; --warn:#935400; --changed:#6a3cb5; --same:#3f5870; --pitch:#1a1720; --shadow:0 1px 0 rgba(20,10,40,.06);
  color-scheme:light } }
:root[data-theme="light"]{
  --bg:#f2f0f5; --panel:#ffffff; --raise:#ebe8f0; --line:#d3cedc; --fg:#17141c; --dim:#4f4860; --faint:#625b72;
  --accent:#ffde1e; --on-accent:#0c0a0e; --brand:#d0105a; --data:#00708a; --focus:#5a2fd0;
  --pass:#0b7a33; --fail:#c0123f; --warn:#935400; --changed:#6a3cb5; --same:#3f5870; --pitch:#1a1720; --shadow:0 1px 0 rgba(20,10,40,.06);
  color-scheme:light }
:root[data-theme="dark"]{
  --bg:#0f0d13; --panel:#17141d; --raise:#211d29; --line:#332d3f; --fg:#f4f0e4; --dim:#b8b0c4; --faint:#8a8298;
  --accent:#ffde1e; --on-accent:#0c0a0e; --brand:#ff2878; --data:#5ad3ec; --focus:#ffde1e;
  --pass:#7cff9a; --fail:#ff6b8e; --warn:#ffbe55; --changed:#c7a6ff; --same:#9fb4c8; --pitch:#07060a; --shadow:0 1px 0 rgba(0,0,0,.4);
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 var(--s0)/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:var(--s4);font-weight:700}
h2{font-size:var(--s3);font-weight:700}
h3{font-size:var(--s2);font-weight:700}
p{margin:0;max-width:68ch}
a{color:var(--data)}
.num,.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;z-index:50;background:var(--accent);color:var(--on-accent);padding:8px 12px;border-radius:var(--r)}
.skip:focus{left:max(16px,env(safe-area-inset-left,0px))}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell */
.app{height:100%;display:grid;grid-template-rows:var(--top) 1fr;grid-template-columns:var(--rail) minmax(0,1fr)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;background:var(--panel);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo b{font:10px/1 var(--f-pixel);letter-spacing:.08em;color:var(--fg)}
.logo i{width:14px;height:14px;background:var(--brand);box-shadow:4px 4px 0 var(--accent);display:block}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font:500 var(--s-1) var(--f-data);color:var(--dim);white-space:nowrap}
.top .search{flex:1 1 auto;max-width:420px;margin-left:auto;position:relative}
.top .search input{width:100%;height:36px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);padding:0 34px 0 12px}
.top .search kbd{position:absolute;right:8px;top:8px}
kbd{font:500 11px/1 var(--f-data);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:3px 5px;color:var(--dim);background:var(--raise)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--raise);cursor:pointer;white-space:nowrap;font-weight:700}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.small{min-height:30px;padding:0 10px;font-size:var(--s-1)}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.rail{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.rail button{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:var(--r);border:0;background:none;cursor:pointer;text-align:left;color:var(--dim);font-weight:700}
.rail button:hover{background:var(--raise);color:var(--fg)}
.rail button[aria-current="page"]{background:var(--raise);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.rail button .n{margin-left:auto;font:500 var(--s-1) var(--f-data);color:var(--faint)}
.rail .sep{height:1px;background:var(--line);margin:8px 6px}
.rail .cap{font:8px/1.6 var(--f-pixel);letter-spacing:.08em;color:var(--faint);padding:8px 10px 4px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{overflow-y:auto;min-width:0}
.page{padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px;max-width:1500px}
.eyebrow{font:8px/1.6 var(--f-pixel);letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
.lede{color:var(--dim);font-size:var(--s1)}
.head{display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.muted{color:var(--dim)}
.faint{color:var(--faint)}

/* ---------- pills: icon + word, colour only supports */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 9px 1px 7px;font:700 var(--s-1)/1.6 var(--f-body);white-space:nowrap;border:1px solid currentColor}
.pill .g{font:500 12px/1 var(--f-data)}
.v-pass{color:var(--pass)} .v-fail{color:var(--fail)} .v-warn{color:var(--warn)} .v-changed{color:var(--changed)} .v-same{color:var(--same)} .v-plain{color:var(--dim)} .v-you{color:var(--brand)} .v-dice{color:var(--warn)}
.kind{display:inline-flex;align-items:center;gap:6px;font:700 var(--s-1)/1.6 var(--f-body);color:var(--dim);white-space:nowrap}
.kind i{width:8px;height:8px;border-radius:2px;background:var(--dim);display:block}
.kind.auto i{background:var(--data)} .kind.you i{background:var(--brand)} .kind.watch i{background:var(--accent)}
.term{border:0;background:none;padding:0;color:inherit;cursor:help;text-decoration:underline dotted var(--dim);text-underline-offset:3px;font:inherit}
.term:hover{text-decoration-color:var(--fg)}

/* ---------- start */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;counter-reset:s}
.step{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding:14px}
.step b.k{grid-row:span 2;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font:10px var(--f-pixel)}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.preset{display:grid;gap:10px;padding:16px;align-content:start}
.preset .facts{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--dim);font-size:var(--s-1)}
.preset .facts b{color:var(--fg);font-family:var(--f-data);font-weight:500}
.preset .row{margin-top:auto}
.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat-strip > div{background:var(--panel);padding:12px 14px;display:grid;gap:2px}
.stat-strip b{font:500 var(--s3)/1.1 var(--f-data)}
.stat-strip span{color:var(--dim);font-size:var(--s-1)}

/* ---------- catalogue */
.cat{display:grid;grid-template-columns:230px minmax(0,1fr) minmax(320px,420px);gap:14px;align-items:start}
.groups{display:grid;gap:2px;padding:8px;position:sticky;top:0}
.groups button{display:flex;gap:8px;align-items:baseline;border:0;background:none;text-align:left;padding:7px 8px;border-radius:4px;cursor:pointer;color:var(--dim)}
.groups button:hover{background:var(--raise);color:var(--fg)}
.groups button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.groups button .id{font:500 var(--s-1) var(--f-data);min-width:30px;color:var(--faint)}
.groups button .c{margin-left:auto;font:500 var(--s-1) var(--f-data);color:var(--faint)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.filters .lab{font-size:var(--s-1);color:var(--faint);margin-right:2px}
.fchip{min-height:28px;border-radius:999px;border:1px solid var(--line);background:none;padding:0 10px;font-size:var(--s-1);font-weight:700;cursor:pointer;color:var(--dim)}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:var(--s-1);color:var(--faint);font-weight:700;position:sticky;top:0;background:var(--panel)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--raise)}
tbody tr.sel td{background:var(--raise)}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.rowbtn{border:0;background:none;padding:0;text-align:left;cursor:pointer;display:block;font-weight:700}
.rowbtn:hover{text-decoration:underline}
td.idc{font:500 var(--s-1) var(--f-data);color:var(--dim);white-space:nowrap}
td .nm{display:block;font-weight:700}
td .sb{display:block;color:var(--dim);font-size:var(--s-1)}
.case{display:grid;gap:0;position:sticky;top:0}
.case header{padding:16px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.case section{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.case section:last-child{border-bottom:0}
.case h4{margin:0;font:8px/1.6 var(--f-pixel);letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
.case ol{margin:0;padding-left:20px;display:grid;gap:3px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
dl.kv dt{color:var(--faint);font-size:var(--s-1);padding-top:2px}
dl.kv dd{margin:0;min-width:0;font-family:var(--f-data);font-size:13px;overflow-wrap:anywhere}
.selbar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line)}

/* ---------- run */
.runwrap{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 360px;align-items:start}
.runwrap.bench{grid-template-columns:260px minmax(0,1fr) 340px}
.runwrap:not(.bench) .queue{display:none}
.stage{background:var(--pitch);border-radius:var(--r);overflow:hidden;position:relative;aspect-ratio:1067/496;max-width:100%}
.stage img{display:block;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.hud{position:absolute;left:10px;top:10px;right:10px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.hud span{background:var(--over);color:var(--over-fg);padding:5px 9px;border-radius:4px;font:500 12px var(--f-data)}
.hud span.t{font:8px/1.6 var(--f-pixel);letter-spacing:.06em;color:var(--over-hi)}
.verdict{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:8px 14px;border-radius:6px;font:700 var(--s1) var(--f-body);background:var(--over-card);color:var(--over-ink);display:flex;gap:8px;align-items:center;max-width:calc(100% - 24px)}
.transport{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{min-height:32px;min-width:44px;border:0;border-right:1px solid var(--line);background:var(--raise);cursor:pointer;font:500 var(--s-1) var(--f-data);padding:0 8px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.field{display:inline-flex;align-items:center;gap:8px;font-size:var(--s-1);color:var(--dim)}
.field input[type=text],.field input[type=number],.field select{height:32px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);padding:0 8px;font-family:var(--f-data);font-size:13px}
.field input#seed{width:120px}
.qlist{list-style:none;margin:0;padding:6px;display:grid;gap:2px;max-height:560px;overflow-y:auto}
.qlist li{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;padding:6px 8px;border-radius:4px;font-size:var(--s-1)}
.qlist li.cur{background:var(--raise);box-shadow:inset 3px 0 0 var(--accent)}
.qlist li .g{font:500 12px var(--f-data);grid-row:span 2;padding-top:2px;min-width:16px;text-align:center}
.qlist li b{font-weight:700}
.qlist li span:not(.g){color:var(--dim);grid-column:2}
.progress{height:6px;background:var(--raise);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--data);width:0;transition:width .2s}
.side{display:grid;gap:14px}
.rate{display:grid;gap:10px}
.rate .row .btn{flex:1 1 0}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.note{width:100%;min-height:36px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);padding:6px 10px}

/* ---------- results */
.runs{display:grid;gap:8px}
.runcard{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;padding:12px 14px;cursor:pointer;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.runcard.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.runcard .tag{font:8px/1.6 var(--f-pixel);letter-spacing:.06em;padding:5px 7px;border-radius:4px;background:var(--raise);color:var(--dim)}
.runcard .tag.a{background:var(--accent);color:var(--on-accent)}
.runcard .counts{display:flex;flex-wrap:wrap;gap:6px;grid-column:2/-1}
.cmp td.delta{font-family:var(--f-data);font-size:13px;white-space:nowrap}
.cmp td.o{font-family:var(--f-data);font-size:12.5px;min-width:200px}

/* ---------- matrix */
.mx{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.factor{display:grid;grid-template-columns:170px 1fr;gap:8px 14px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.factor:last-child{border-bottom:0}
.factor .fn{display:grid;gap:2px}
.factor .fn b{font-weight:700}
.factor .fn span{color:var(--faint);font-size:var(--s-1)}
.vals{display:flex;flex-wrap:wrap;gap:6px}
.count{display:grid;gap:12px;padding:16px;position:sticky;top:0}
.bignum{font:500 44px/1 var(--f-data);color:var(--fg)}
.choice{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:baseline;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.choice:has(input:checked){border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.choice input{accent-color:var(--accent)}
.choice .c{font:500 var(--s1) var(--f-data)}
.choice small{grid-column:2/-1;color:var(--dim)}
.grid-res td,.grid-res th{text-align:center;vertical-align:middle;padding:6px}
.grid-res th[scope=row]{text-align:left}
.cell{display:grid;gap:1px;justify-items:center;padding:6px 4px;border-radius:4px;font-size:12px;font-weight:700;border:1px solid var(--line)}
.cell .g{font:500 14px var(--f-data)}
.cell.goal{color:var(--fail)} .cell.save{color:var(--pass)} .cell.other{color:var(--dim)}

/* ---------- actions */
.covbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--raise)}
.covbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:var(--s-1);color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
td .code{font:500 12px var(--f-data);color:var(--data)}

/* ---------- animations */
.anim{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
.alist{display:grid;gap:1px;max-height:640px;overflow-y:auto;padding:6px}
.alist button{display:grid;grid-template-columns:1fr auto;gap:0 8px;text-align:left;border:0;background:none;padding:6px 8px;border-radius:4px;cursor:pointer;color:var(--dim)}
.alist button:hover{background:var(--raise);color:var(--fg)}
.alist button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.alist button b{font:500 13px var(--f-data);color:inherit}
.alist button small{font-size:11px;color:var(--faint)}
.alist button .fl{grid-column:1/-1;font-size:11px;color:var(--warn)}
.compass{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:560px}
.dcell{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--raise);display:grid;place-items:center;padding:20px 4px 6px;cursor:pointer;min-height:120px}
.dcell[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dcell .d{position:absolute;left:6px;top:4px;font:500 11px var(--f-data);color:var(--faint)}
.dcell .fc{position:absolute;right:6px;top:4px;font:500 11px var(--f-data);color:var(--faint)}
.dcell canvas{image-rendering:pixelated;max-width:100%;height:auto}
.dcell.miss{border-style:dashed;cursor:default;color:var(--faint);font-size:12px;text-align:center}
.dcell.mid{cursor:default;background:none;border:0;text-align:center;font-size:var(--s-1);color:var(--dim)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px}
.fr{flex:none;display:grid;gap:3px;justify-items:center;border:1px solid var(--line);border-radius:4px;padding:4px;background:var(--raise);cursor:pointer;min-width:52px}
.fr[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fr canvas{image-rendering:pixelated}
.fr span{font:500 11px var(--f-data);color:var(--faint)}
.fr .ct{font:700 10px var(--f-body);color:var(--on-accent);background:var(--accent);padding:0 5px;border-radius:3px}
.checks{margin:0;padding-left:18px;display:grid;gap:4px;color:var(--dim)}

/* ---------- glossary + tip + dialog + toast */

<script>
'use strict';
(function () {
const D = window.PROTO;
D.dirs = D.dirs || ['E', 'NE', 'N', 'NW', 'W', 'SW', 'S', 'SE'];
// v3: the 12 move clips filmed for the Training ground (v2's data file stays as it was)
D.clips = [...(D.clips || []), 'shot', 'plob30', 'plob60', 'plob100', 'sp1', 'sp2', 'air-sp1', 'air-sp2', 'air-sp3', 'ball-head', 'ball-waist', 'ball-feet'];
if (!D.sheets) D.sheets = [['out', 'Outfield player'], ['gk', 'Keeper'], ['ref', 'Referee']].map(([rg, l]) => { const R = D.rigs[rg], k = Object.keys(R.kits)[0];
  return { key: k, label: `${l} (${k.split('-')[0]} kit)`, img: k + '.webp', anims: R.anims, frames: R.kits[k], kits: Object.keys(R.kits) }; });
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem('hc2-proto-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hc2-proto-' + k, JSON.stringify(v)); } catch (e) {} } };

// ======================================================================= the data, made readable
const TESTS = [], BY = {};
D.groups.forEach(g => g.tests.forEach(t => { t.group = g.id; t.groupName = g.name; TESTS.push(t); BY[t.id] = t; }));
const typeOf = t => t.kind === 'cut' || t.kind === 'clip' ? 'watch' : t.kind === 'free' || t.you ? 'you' : 'auto';
const TYPE_NAME = { auto: 'Automatic', you: 'You play', watch: 'You watch' };
const GROUP_PLAIN = { FP: 'Play freely: every move on a button', K: 'Keeper v shots from 6 spots to 5 places', KH: 'Keeper v hard and soft shots', YS: 'You shoot at a live keeper',
  C: 'Keeper v crosses', P: 'Ball physics: passes, lobs, bounces', M: 'Running without the ball', D: 'Dribbling', T: 'Tackles', A: 'Balls in the air to you', PK: 'Penalties',
  N5: 'Power lob, rain, snow, injury', PW: 'Power specials through blockers', CH: 'The chip shot', GK: 'Keeper AI: where he stands and why', SM: 'Special moves and keeper saves',
  CS: 'Every cut scene in full', BW: 'Clips the Bug Watch kept' };

// draft TARGETS (expected results), written from each test's own description - for Luca to confirm (decision 3)
const num = (s, re) => { const m = String(s || '').match(re); return m ? +m[1] : null; };
const maxOut = o => num(o, /max ([\d.]+)/), stopAt = o => num(o, /STOPPED ([\d.]+) m/);
const outOf = id => BY[id] && BY[id].r ? BY[id].r.outcome : '';

function verdict(t, run = 'now') {
  const ty = typeOf(t);
  if (ty === 'you') return { k: 'you', g: '▶', w: 'You play' };
  if (ty === 'watch') return { k: 'plain', g: '◉', w: 'You watch' };
  const r = run === 'old' ? (t.old && t.old.r) : t.r;
  if (!r) return { k: 'plain', g: '–', w: 'Not run' };
  if (r.outcome === 'not finished') return { k: 'warn', g: '!', w: 'Can\'t run headless' };
  const T = TARGETS[t.id];
  if (T && T[1]) return T[1](r.outcome) ? { k: 'pass', g: '✓', w: 'Pass' } : { k: 'fail', g: '✗', w: 'Fail' };
  if (T && !T[1]) return { k: 'dice', g: '≈', w: 'Needs repeats' };
  if (run === 'now' && t.old && t.old.r) return same(t.r, t.old.r) ? { k: 'same', g: '=', w: 'Same as ' + D.oldVer } : { k: 'changed', g: 'Δ', w: 'Changed' };
  return { k: 'plain', g: '•', w: 'Ran · no target' };
}

    phys: ['One player and the ball on an empty pitch.', [`He plays it: ${name}.`, 'The Lab measures speed, height, every bounce and where it stops.']],
    move: ['Only your player; yellow rings show where to go.', ['Move with the arrows or WASD, Shift to sprint.', 'The Lab measures top speed, how far you slide when you stop, the ball from your feet.']],
    tackle: [`A dribbler comes at you: ${name}.`, [`Try the ${sub.toLowerCase()}.`, 'The Lab says if you won it, fouled, or he got past.']],

// ---------------------------------------------------------------- RUN
function startQueue(ids, label, times) {
  const q = []; for (let k = 0; k < (times || 1); k++) for (const id of ids) q.push({ id, lvl: times ? ['Easy', 'Normal', 'Hard', 'Rise Warrior'][k] : null, done: null });
  S.queue = { label, items: q }; S.qi = 0; S.playing = true; go('run'); tickQueue();
}
let qTimer = null;
function tickQueue() {
  clearTimeout(qTimer); const Q = S.queue; if (!Q || !S.playing) return;
  if (S.qi >= Q.items.length) { S.playing = false; renderRun(); toast(`${Q.label}: ${Q.items.length} runs done`); return; }
  const it = Q.items[S.qi], t = BY[it.id];
  renderRun();
  qTimer = setTimeout(() => { it.done = verdict(t); S.qi++; tickQueue(); }, Math.max(380, Math.min(1400, (t.ms || 3000) / 6)) / S.speed);
}
function liveRows(t) {
  const r = t && t.r; if (!r) return '<dt>ball</dt><dd>–</dd>';
  const L = [];
  if (r.kmh != null) L.push(['struck at', `${r.kmh} km/h · top ${r.topHeight} m`]);
  if (r.plan) L.push(['keeper\'s read', `${r.plan.act || 'reading'} · reacts after ${r.plan.react} s · ${r.plan.fromHim} m from him, covers ${r.plan.canCover} m (${r.plan.kind})`]);
  if (r.atLine) L.push(['at his line', `ball ${r.atLine.gap} m from him, ${r.atLine.height} m up · he was ${r.atLine.keeper}`]);
  if (r.atRings) L.push(['at the ring', r.atRings.map(h => `${h.t} s · ${h.kmh} km/h · ${h.z} m up`).join(' / ')]);
  if (r.bounces && r.bounces.length > 1) L.push(['bounces', r.bounces.join(' → ') + ' m']);
  if (r.events && r.events.length) L.push(['called', r.events.slice(-3).join(' · ')]);
  L.push(['time', `${r.t} s of match time`]);
  return L.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('');
}
function vRun() { renderRun(); }

// ---------- football words
const SPOT_W = { 'penalty spot (11 m)': 'from the penalty spot', 'edge of the box (17 m)': 'from the edge of the box', 'angle, top side': 'from a tight angle on the top side',
  'angle, bottom side': 'from a tight angle on the bottom side', 'close range (6 m)': 'from close range', 'long range (25 m)': 'from 25 metres out' };
const TGT_W = { 'low, TOP post': 'low, inside the top post', 'low, BOTTOM post': 'low, inside the bottom post', 'high, TOP corner': 'high into the top corner',
  'high, BOTTOM corner': 'high into the bottom corner', 'straight at him, chest high': 'straight at the keeper, chest high' };
function plainName(t) {
  if (t.group === 'K' || t.group === 'KH') { const [a, b] = t.name.split(' → '); return `Shot ${SPOT_W[a] || a}, ${TGT_W[b] || b}`; }
  const s = t.name.replace(' → ', ' to the '); return s.charAt(0).toUpperCase() + s.slice(1);
}
function outWords(o) {
  o = String(o || '');
  const W = [[/^HEADER → GOAL/, 'a headed goal'], [/^HEADER → KEEPER CLAIMS/, 'the keeper catches it after the header'], [/^HEADER → KEEPER PARRIES/, 'the keeper pushes the header away'],
    [/^KEEPER CLAIMS/, 'the keeper catches the cross'], [/^GOAL/, 'a goal'], [/^SAVED · parried/, 'the keeper pushes it away'], [/^SAVED · caught/, 'the keeper catches it'],
    [/^CHIP .*GOAL/, 'a chip that goes in'], [/^LOB \/ NOT A CHIP/, 'no chip'], [/^OUT/, 'it goes out']];
  const w = W.find(([re]) => re.test(o)); return w ? w[1] : o.split(' · ')[0].toLowerCase();
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const GROUP_KID = { K: 'shots at the keeper', KH: 'hard and soft shots', C: 'crosses', P: 'passes and bounces', PK: 'penalties', N5: 'the power lob, rain and snow',
  PW: 'special shots', CH: 'chips', GK: 'the keeper moving around', SM: 'special moves' };
const CHANGED = AUTO.filter(t => t.r && t.r.outcome !== 'not finished' && t.fresh && t.fresh[0] && cat(t.fresh[0].o) !== cat(t.r.outcome));
const CANT = AUTO.filter(t => t.r && t.r.outcome === 'not finished');
const SAME_N = AUTO.length - CHANGED.length - CANT.length;
const minutesLeft = f => { const m = (1 - f) * 10; return m > 1.5 ? `About ${Math.round(m)} minutes left.` : m > 0.6 ? 'About a minute left.' : 'Nearly done.'; };

// ---------- clips (filmed from the real Lab) with a pause / play-again
const hasClip = n => (D.clips || []).includes(n);
let clipN = 0;
function clipFig(name, label, big) {

}
function spritePic(cv, kit, anim, dir, fi) {                       // one real frame from the kit's sprite sheet
  const sh = kitSheet(kit), A = sh.anims[anim]; if (!A) return; const d = A[dir] ? dir : Object.keys(A)[0], f = A[d][Math.min(fi, A[d].length - 1)];
  const bb = bboxOf(sh, A), z = Math.min(cv.width / bb.w, cv.height / bb.h);
  atlas(sh, img => { const g = cv.getContext('2d'); g.imageSmoothingEnabled = false; g.clearRect(0, 0, cv.width, cv.height);
    const fr = sh.frames[f]; g.drawImage(img, fr[0], fr[1], fr[2], fr[3], (cv.width - bb.w * z) / 2 + (fr[4] - bb.x0) * z, (cv.height - bb.h * z) / 2 + (fr[5] - bb.y0) * z, fr[2] * z, fr[3] * z); });
}

    notes: Object.fromEntries(Object.entries(T.notes).filter(([, v]) => v)), moves: T.moveAns };
}

function vKnobs() { page(`<div class="head"><span class="eyebrow">Advanced</span><h1>Every knob and switch</h1><p class="lede">The Training ground's knobs and switches, the game constant behind each, and whether the Lab can change it today. Every FREE PLAY control of the classic Lab is here (its old name in the Classic column).</p></div>
  <section class="panel" style="min-width:0"><div class="tablewrap"><table><thead><tr><th scope="col">Knob</th><th scope="col">Tab</th><th scope="col">Normal</th><th scope="col">Game constant</th><th scope="col">Classic Lab</th><th scope="col">Today</th></tr></thead><tbody>
  ${KNOBS.map(k => `<tr><td><span class="nm">${esc(k.name)}</span><span class="sb">${esc(k.line)}</span></td><td>${esc(TABS.find(t => t[0] === k.tab)[1])}</td><td class="idc">${k.n}</td><td><span class="code">${esc(k.real(k.n))}</span></td><td>${esc(k.classic || '–')}</td><td>${esc(HOW[k.how])}</td></tr>`).join('')}
  ${SWITCHES.map(s => `<tr><td><span class="nm">${esc(s.name)}</span><span class="sb">${esc(s.line)}</span></td><td>${esc(TABS.find(t => t[0] === s.tab)[1])}</td><td class="idc">${esc(swShow(s, s.def || 0))}</td><td><span class="code">LAB.fp.${s.k}</span></td><td>${esc(s.classic)}</td><td>works today</td></tr>`).join('')}
  </tbody></table></div></section>`); }
const VIEWS = { train: vTrain, knobs: vKnobs, home: vHome, check: vCheck, try: vTry, look: vLook, bugwatch: vBugWatch, adv: vAdv, start: vStart, tests: vTests, run: vRun, results: vResults, matrix: vMatrix, actions: vActions, anims: vAnims, bug: vBug, free: vFree };

// ======================================================================= glossary, tooltips, toast, bug report
function glossary(open) { const g = $('#glossary'); g.hidden = !open; $('#gl-open').setAttribute('aria-expanded', String(open)); if (open) { $('#gl-close').focus(); } }
$('#gl-list').innerHTML = GLOSS.map(([k, w, d, src]) => `<dt id="gl-${k}">${esc(w)}</dt><dd>${esc(d)}${src ? `<small>from: ${esc(src)}</small>` : ''}</dd>`).join('');
function tip(btn) {
  const k = btn.dataset.term, g = GL[k], T = $('#tip'); if (!g) return;
  if (!T.hidden && T.dataset.for === k) { T.hidden = true; btn.setAttribute('aria-expanded', 'false'); return; }
  T.innerHTML = `<b>${esc(g[1])}</b>${esc(g[2])}`; T.dataset.for = k; T.hidden = false; btn.setAttribute('aria-expanded', 'true'); btn.setAttribute('aria-describedby', 'tip');
  const r = btn.getBoundingClientRect(), w = Math.min(300, innerWidth - 32); T.style.width = w + 'px';
  T.style.left = Math.max(16, Math.min(innerWidth - w - 16, r.left)) + 'px'; T.style.top = (r.bottom + 8 + T.offsetHeight > innerHeight ? r.top - T.offsetHeight - 8 : r.bottom + 8) + 'px';
}
let toastT = null;
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2600); }
function copyText(text, el) {
  const fallback = () => { if (el) { el.hidden = false; el.value = text; el.focus(); el.select(); } toast('Select all and copy it yourself: the browser blocked copying'); };
  try { navigator.clipboard.writeText(text).then(() => toast('Copied'), fallback); } catch (e) { fallback(); }
}
function bugReport(id) {
  const t = BY[id], c = caseOf(t), d = $('#bug'), v = verdict(t);
  const make = () => { const sev = (d.querySelector('[name=sev]:checked') || {}).value, pri = (d.querySelector('[name=pri]:checked') || {}).value;
    $('#bug-text').value = [`TITLE: ${$('#bug-title').value}`, `SEVERITY: ${sev} · PRIORITY: ${pri}`, `VERSION: ${D.ver} · TEST: ${t.id} (${t.groupName}) · SEED: ${t.seed != null ? t.seed : '(set when run)'}`, '',
      'STEPS TO REPRODUCE', `1. Open the Test Lab, Tests, group ${t.group}, test ${t.id}.`, `2. Set the seed to ${t.seed != null ? t.seed : 'the one in the run'} and press Run (or: GROUP=${t.group} node tools/grp.js).`, ...c.steps.map((s, j) => `${j + 3}. ${s}`), '',
      `EXPECTED: ${c.expected || '(no target yet) as on the baseline'}`, `ACTUAL: ${t.r ? t.r.outcome : '(you play this one: say what happened)'} → ${v.w}`, `WHAT I SAW: ${$('#bug-note').value || '-'}`, '',
      `EVIDENCE: ${t.r ? JSON.stringify(t.r) : '-'}`].join('\n'); };
  $('#bug-title').value = `${t.id}: ${t.name}${t.r ? ' → ' + t.r.outcome.split(' · ')[0] : ''}`; $('#bug-note').value = '';
  make(); d.oninput = make; d.onchange = make; d.showModal();
}
$('#bug-copy').addEventListener('click', () => copyText($('#bug-text').value, $('#bug-text')));

// ======================================================================= events (one delegated handler)
document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-t],input[type=checkbox]'); if (!b) { if (!$('#tip').hidden && !e.target.closest('#tip')) $('#tip').hidden = true; return; }
  const ds = b.dataset;
  if (ds.term) { e.preventDefault(); e.stopPropagation(); tip(b); return; }
  if (!$('#tip').hidden) $('#tip').hidden = true;
  if (ds.v === 'train') { T.mode = 'home'; T.move = null; }   // from Home: always the Training ground's own start screen
  if (ds.tmode) { T.mode = ds.tmode; if (ds.tmode !== 'feel') T.move = null; return vTrain(); }
  if (ds.tcat) { T.cat = ds.tcat; return vTrain(); }
  if (ds.tmove) { T.move = ds.tmove; T.variant = 0; return vTrain(); }
  if (ds.tvar) { T.variant = +ds.tvar; return vTrain(); }
  if (ds.tans) { T.moveAns[T.move] = { a: ds.tans, note: ($('#tnote') || {}).value || '', changes: changedList() }; saveT(); toast('Saved.'); return vTrain(); }
  if (ds.ttab) { T.tab = ds.ttab; T.more = false; return vTrain(); }
  if (ds.sw) { T.sw[ds.sw] = +ds.swi; T.last = ds.sw; saveT(); return vTrain(); }
  if (ds.kreset) { const k = KNOBS.find(x => x.k === ds.kreset); T.vals[k.k] = k.n; saveT(); toast(k.name + ': back to normal'); return vTrain(); }
  if (ds.tact) { const k = ds.tact;
    if (k === 'reset-all') { KNOBS.forEach(x => { T.vals[x.k] = x.n; }); SWITCHES.forEach(x => { T.sw[x.k] = x.def || 0; }); T.last = null; saveT(); toast('Everything is back to normal.'); return vTrain(); }
    if (k === 'more') { T.more = !T.more; return vTrain(); }
    if (k === 'slow') { T.slow = T.slow === 1 ? 0.5 : T.slow === 0.5 ? 0.25 : 1; return vTrain(); }
    if (k === 'boxes') { T.boxes = !T.boxes; return vTrain(); }
    if (k === 'again') { const img = document.querySelector('img[data-clip]'); if (img) img.src = `clips/${img.dataset.clip}.webp?r=${++clipN}`; return; }
    if (k === 'suggest') { const sg = suggestion(); if (!sg.knobs.length && !sg.switches.length && !Object.keys(sg.notes).length) { toast('Change something or write how it feels first.'); return; }
      T.sent.push(sg); saveT(); copyText(suggestText(sg), null); toast('Saved for Claude. The game stays as it is until Luca OKs a change.'); return vTrain(); }
    toast({ ball: 'In the real Lab the ball comes back to your feet.', zin: 'In the real Lab the camera moves closer.', zout: 'In the real Lab the camera moves further away.' }[k] || ''); return; }
  if (ds.act) { const k = ds.act;
    if (k === 'check-start') { H.check = 'playing'; H.prog = 0; return vCheck(); }
    if (k === 'check-stop') { H.check = 'ready'; return vCheck(); }
    if (k === 'check-again') { H.check = 'ready'; V2.checkAns = {}; H.watch = null; save2(); return vCheck(); }
    if (k === 'more') { H.movePage = (H.movePage + 1) % Math.ceil(MOVES.length / 5); return vTry(); }
    if (k === 'moves') { H.move = null; return vTry(); }
    if (k === 'turn') { H.dirI++; return vLook(); }
    if (k === 'aplay') { H.playA = true; return vLook(); }
    if (k === 'askip') { H.animI++; H.dirI = 0; return vLook(); }
    if (k === 'gloss') return glossary(true); }
  if (ds.watch) { H.watch = ds.watch; return vCheck(); }
  if (ds.ok) { V2.checkAns[ds.ok] = 'ok'; save2(); H.watch = null; H.cur = firstOpen(); toast('OK. Saved.'); return vCheck(); }
  if (ds.rep) { const t = BY[ds.rep]; V2.checkAns[ds.rep] = 'report'; save2(); H.watch = null; H.cur = firstOpen(); vCheck(); return report2(`${t.id} · ${plainName(t)}: was ${outWords(t.r.outcome)}, now ${outWords(t.fresh[0].o)}`); }
  if (ds.move) { H.move = ds.move; return vTry(); }
  if (ds.mans) { V2.moveAns[H.move] = { a: ds.mans, note: ($('#mnote') || {}).value || '' }; save2(); toast('Saved.'); return vTry(); }
  if (ds.mredo) { delete V2.moveAns[ds.mredo]; save2(); return vTry(); }
  if (ds.aans) { const sh = kitSheet(H.kit), names = Object.keys(sh.anims); V2.animAns[H.kit + ':' + names[H.animI % names.length]] = ds.aans; save2(); H.animI++; H.dirI = 0; toast('Saved. Here is the next one.'); return vLook(); }
  if (ds.again) { const img = document.querySelector(`img[data-clip="${ds.again}"]`); if (img) img.src = `clips/${ds.again}.webp?r=${++clipN}`; b.textContent = 'Play again'; return; }
  if (ds.still) { const img = document.querySelector(`img[data-clip="${ds.still}"]`); if (img) img.src = `clips/${ds.still}.jpg`; const pb = b.previousElementSibling; if (pb) pb.textContent = 'Play'; return; }
  if (b.id === 'b2-open') return report2();
  if (b.id === 'b2-send') { copyText(report2Text(), null); $('#bug2').close(); toast('Copied for Claude. In the real Lab it goes to Claude by itself.'); return; }
  if (ds.v) return go(ds.v, {});
  if (ds.go) return go(ds.go, {});
  if (ds.run) { const p = PRESETS.find(x => x.id === ds.run); return startQueue(p.tests, p.name, p.times); }
  if (ds.see) { const p = PRESETS.find(x => x.id === ds.see); S.picked = new Set(p.tests); S.q = ''; S.group = BY[p.tests[0]].group; return go('tests', { sel: p.tests[0] }); }
  if (ds.g) { S.q = ''; $('#q').value = ''; S.group = ds.g; S.sel = (D.groups.find(g => g.id === ds.g).tests[0] || {}).id; return vTests(); }
  if (ds.f) { const set = S[ds.f]; set.has(ds.k) ? set.delete(ds.k) : set.add(ds.k); return vTests(); }
  if (ds.pick) { b.checked ? S.picked.add(ds.pick) : S.picked.delete(ds.pick); e.stopPropagation(); const bar = $('.selbar'); bar.hidden = !S.picked.size; $('#pickn').textContent = S.picked.size + ' picked'; return; }
  if (b.id === 'run-picked') return startQueue([...S.picked], `${S.picked.size} picked tests`);
  if (b.id === 'clear-picked') { S.picked.clear(); return vTests(); }
  if (ds.t) { S.sel = ds.t; vTests(); const f = document.querySelector(`.rowbtn[data-t="${ds.t}"]`); if (f && b.tagName === 'BUTTON') f.focus(); return; }
  if (ds.run1) return startQueue([ds.run1], `${ds.run1} · ${BY[ds.run1].name}`);
  if (ds.run10) { const t = BY[ds.run10]; S.queue = null; toast(`In the build: ${t.id} runs 10 times with new dice and shows how often each outcome came up`); return; }
  if (ds.bug) return bugReport(ds.bug);
  if (ds.lay) { S.layout = ds.lay; store.set('layout', S.layout); return renderRun(); }
  if (ds.sp) { S.speed = +ds.sp; return renderRun(); }
  if (ds.tp) { const k = ds.tp;
    if (k === 'play') { if (S.queue && S.qi < S.queue.items.length) { S.playing = !S.playing; S.playing ? tickQueue() : renderRun(); } else toast('Nothing queued: pick a preset or tests first'); return; }
    if (k === 'boxes') { S.boxes = !S.boxes; return renderRun(); }
    toast({ restart: 'In the build: R replays this test with the same seed, frame for frame', step: 'In the build: the game moves on exactly one frame (1/60 s)', dice: 'In the build: F replays with a new random seed and shows it here' }[k]); return; }
  if (ds.rate) { if (ds.rate === '2') { $('#reasons').hidden = false; toast('Pick what looks wrong (3-7), then the next test saves it'); } else toast('Saved: looks right, with the numbers and the seed'); return; }
  if (ds.reason) { b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')); return; }
  if (ds.ra) { S.runA = ds.ra; return vResults(); }
  if (ds.rb) { S.runB = ds.rb; return vResults(); }
  if (b.id === 'onlydiff') { S.onlyDiff = !S.onlyDiff; return vResults(); }
  if (ds.copy) return copyText(exportText(ds.copy), $('#dump'));
  if (ds.mf != null) { const s = S.mx.sel[+ds.mf], v = +ds.mv; if (s.has(v)) { if (s.size > 1) s.delete(v); } else s.add(v); S.mx.rows = null; return vMatrix(); }
  if (b.id === 'mx-make') { S.mx.rows = mxRows(); vMatrix(); toast(`${S.mx.rows.length} runs listed`); return; }
  if (b.id === 'mx-run') { const n = (S.mx.how === 'pair' ? mxCounts().pair : mxCounts().full) * S.mx.rep; toast(`In the build: ${n} runs go to the queue, the results fill a grid like the one below`); return; }
  if (ds.try) { toast(`In the build: "${ds.try}" fires on your player in free play`); return; }
  if (ds.an) { S.anim.name = ds.an; S.anim.f = 0; return vAnims(); }
  if (ds.dir) { S.anim.dir = ds.dir; S.anim.f = 0; return vAnims(); }
  if (ds.fj != null) { S.anim.f = +ds.fj; S.anim.play = false; return vAnims(); }
  if (ds.fs) { stepFrame(+ds.fs); return; }
  if (b.id === 'aplay') { S.anim.play = !S.anim.play; return vAnims(); }
  if (b.id === 'gl-open') return glossary($('#glossary').hidden);
  if (b.id === 'gl-close') return glossary(false);
  if (b.id === 'theme') { const r = document.documentElement, cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); r.dataset.theme = cur === 'light' ? 'dark' : 'light'; store.set('theme', r.dataset.theme); return; }
});
function stepFrame(d) { const A = D.sheets[S.anim.sheet].anims[S.anim.name][S.anim.dir]; S.anim.play = false; S.anim.f = (S.anim.f + d + A.length) % A.length; clearInterval(animTimer); if (S.animPaint) S.animPaint(); const p = $('#aplay'); if (p) p.innerHTML = 'Play <kbd>Space</kbd>'; }
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'tmpl') { mxInit(t.value); return vMatrix(); }
  if (t.name === 'how') { S.mx.how = t.value; S.mx.rows = null; return vMatrix(); }
  if (t.id === 'rep') { S.mx.rep = +t.value; return vMatrix(); }
  if (t.id === 'sheet') { S.anim.sheet = +t.value; S.anim.name = 'idle'; S.anim.f = 0; return vAnims(); }
  if (t.id === 'kit') { H.kit = t.value; H.animI = 0; H.dirI = 0; return vLook(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; if (S.view !== 'tests') go('tests', { focus: false }); else vTests(); const q = $('#q'); q.focus(); return; }
  if (e.target.id === 'b2-what') return;
  if (e.target.id === 'fnote') { T.notes[T.tab] = e.target.value; saveT(); return; }
  if (e.target.id && e.target.id.startsWith('kn-')) { const k = KNOBS.find(x => 'kn-' + x.k === e.target.id), v = +e.target.value; T.vals[k.k] = v; T.last = k.k; saveT();
    const box = e.target.closest('.knob'); box.querySelector('.fx').textContent = k.fx(v); box.querySelector('.real').textContent = `${k.real(v)} · ${HOW[k.how]}`;
    box.querySelector('[data-kreset]').hidden = Math.abs(v - k.n) < 1e-9; paintChanged();
    const fl = document.querySelector('label[for="fnote"]'); if (fl && fl.firstChild) fl.firstChild.textContent = `You changed ${k.name.toLowerCase()}. How does it feel now?`; return; }
  if (e.target.id === 'aq') { S.anim.q = e.target.value; const pos = e.target.selectionStart; vAnims(); const n = $('#aq'); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', e => {
  const tg = e.target, typing = tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT');
  if (e.key === 'Escape') { if (!$('#tip').hidden) { $('#tip').hidden = true; return; } if (!$('#glossary').hidden) { glossary(false); $('#gl-open').focus(); } return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (tg && tg.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  if (S.view === 'train') { const m = { e: 'ball', t: 'slow', h: 'boxes' }[e.key.toLowerCase()]; if (m) { const bt = document.querySelector(`[data-tact="${m}"]`); if (bt) { e.preventDefault(); bt.click(); } return; } }
  if (ADV.has(S.view) && e.key === '/') { e.preventDefault(); $('#q').focus(); return; }
  if (ADV.has(S.view) && e.key === '?') { glossary($('#glossary').hidden); return; }
  if (S.view === 'anims') { if (e.key === '.' || e.key === ',') { e.preventDefault(); stepFrame(e.key === '.' ? 1 : -1); } else if (e.key === ' ') { e.preventDefault(); S.anim.play = !S.anim.play; vAnims(); } return; }
  if (S.view === 'run') { const map = { ' ': 'play', r: 'restart', '.': 'step', f: 'dice', h: 'boxes' }, k = map[e.key.toLowerCase()];
    if (k) { e.preventDefault(); const btn = document.querySelector(`[data-tp="${k}"]`); if (btn) btn.click(); }
    if (e.key === '1' || e.key === '2') { const btn = document.querySelector(`[data-rate="${e.key}"]`); if (btn) btn.click(); } }
});

// ======================================================================= boot
try { const th = store.get('theme', null); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
$('#ver').textContent = D.ver;
const start = location.hash.slice(1); go(VIEWS[start] ? start : 'home', { focus: false });
addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== S.view) go(v, {}); });   // a #section link or the back button
})();
</script>
